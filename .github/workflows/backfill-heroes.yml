name: Backfill All Hero Images

# Regenerates hero images for the posts listed in SLUGS below, using the canonical Imagen pipeline + the growthmax-imagery skill.
# Triggered manually via workflow_dispatch. Commits the new heroes directly
# to the repo root (overwriting existing blog-*.jpg files), and cleans up
# the /samples/ and /poc-samples/ scratch folders in the same commit.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic google-genai Pillow pyyaml

      - name: Render missing hero images
        env:
          ANTHROPIC_API_KEY: ${{ secrets.WEBSITE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMAGE_MODEL_TIER: free
          # The 19 posts still on the /growthMAX.PNG placeholder (2026-07-01
          # onward), left behind when hero rendering silently failed on a
          # deprecated model string. Regenerate SLUGS with:
          #   for f in _posts/*.md; do s=$(basename $f .md|sed 's/^[0-9-]\{11\}//'); \
          #     [ -f "blog-$s.jpg" ] || echo -n "$s,"; done
          SLUGS: 12-month-ai-transformation-roadmap,what-a-custom-ai-agent-costs-and-why,ai-agents-for-operations-teams,ai-readiness-assessment,guide-to-ai-training-for-executives,will-ai-replace-my-job,enterprise-ai-agent-security-buyers-checklist,ai-agents-for-finance-teams,how-to-evaluate-ai-vendors-scorecard,human-in-the-loop-ai-enterprise,ai-governance-framework-enterprise,ai-pilot-to-production-what-goes-wrong,ai-business-case-template,what-belongs-in-an-ai-literacy-curriculum,how-to-upskill-your-workforce-on-ai,growthmax-ai-adoption-framework,ai-center-of-excellence-playbook,ai-rollout-plan-your-team-will-actually-follow,measuring-roi-on-enterprise-ai-training
          # Render to repo root, not /samples/
          OUTPUT_DIR: '.'
        # Don't fail the whole job if a few renders fail — commit what we got
        # and re-run for the failures.
        continue-on-error: true
        run: python scripts/render_samples.py

      - name: Cleanup scratch folders
        run: |
          rm -rf samples poc-samples
          echo "scratch folders removed"

      - name: Commit backfill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- 'blog-*.jpg'
          git add -A -- samples poc-samples 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes — backfill produced nothing new"
            exit 1
          fi
          git commit -m "Backfill hero images (canonical look)"
          git push
